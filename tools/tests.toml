# テストの一覧(`make test` が回すもの全部)。回すのは tools/test_plan.py(規則はその冒頭)。
# - tier = "fast": make test-fast が回す。合計の CPU 時間(子プロセスの user＋sys。壁時計ではない)が 60 秒以内(上限は test_plan.py の FAST_CPU_BUDGET)。
# - tier = "heavy": make test が回す。変えたパスが paths に合うときは make test-paths PATHS="..." でも回す。paths が無い heavy は置けない。
# - paths: そのテストが対象にするファイルの glob(`*` は / を越えない、`**` は越える)。tools/*.py・tools/test_*.sh・scripts/tests/*・scripts/*_selftest.py は、
#   どれかの cmd か paths に無いと落ちる(登録漏れ)。tools/test_*.py|sh は cmd に書く(paths に書くだけでは登録にならない)。どの名前にも当たらない paths も落ちる。
# - cpu_limit: そのテストの CPU 時間の上限(秒)。tier を動かして「速くした」ことにしない(heavy を足す・fast に戻すのは tools/test_test_plan.py の HEAVY の差分に出る)。
# - cmd の {py} {ENV_FILE} {TEST_CONFIG} は Makefile が渡す値に置き換わる。並びは make test が回す順。

[[test]]
name = "epic_gate_controller_selftest"
cmd = ["{py}", "-W", "error", "epic_gate_controller.py", "--selftest"]
cwd = "scripts"
env = { SF_CONFIG = "{TEST_CONFIG}" }
tier = "fast"
cpu_limit = 15
paths = ["scripts/epic_selftest.py", "scripts/ship_selftest.py", "scripts/tests/*", "scripts/epic_gate_controller.py"]

